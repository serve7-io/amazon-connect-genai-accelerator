# {{COMPANY}} - self-service AI agent settings (generated by scripts/new-tenant.py on {{DATE}}).
# Read by stacks/40-genai/agent.tf (agent + tools) and checked by scripts/check-tenants.py.
company: "{{COMPANY}}"
assistant_name: ""          # optional name the assistant introduces itself with, e.g. "Max"

# Brand voice and rules, added to the start of the agent's orchestration prompt. Plain sentences, no double curly braces.
# Leave empty to use the AWS-managed prompt unchanged. Keep it short (5-15 lines): tone, what the assistant
# helps with, what it must not do or promise, and when to hand over to a person.
persona: ""

# Shown to the model as the format of a customer id; match the ids in demo-crm.json.
customer_id_example: C1001

# Ticket categories the create_support_ticket tool accepts ("other" is always allowed).
ticket_categories: [billing, technical, order, account, other]
