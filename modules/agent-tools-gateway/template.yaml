AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Serve7 accelerator - MCP tool gateway for agentic self-service. Amazon Bedrock AgentCore Gateway with a
  Lambda target exposing the Serve7 CRM tools (customer_lookup, retrieve_status, create_support_ticket).
  Deployed by stacks/40-genai/agentic.tf through aws_cloudformation_stack (validated with cfn-lint schemas).

Parameters:
  Prefix:
    Type: String
  ToolsLambdaArn:
    Type: String
  PermissionsBoundaryArn:
    Type: String
  RolePath:
    Type: String
    Default: /serve7/workload/
  AuthorizerType:
    Type: String
    Default: CUSTOM_JWT
    AllowedValues: [AWS_IAM, CUSTOM_JWT]
    Description: >-
      How callers authenticate. Amazon Connect AI agents present JWTs issued by the instance, so
      Connect needs CUSTOM_JWT with the instance discovery URL.
  JwtDiscoveryUrl:
    Type: String
    Default: ""
    Description: OIDC discovery URL, e.g. https://<alias>.my.connect.aws/.well-known/openid-configuration
  AllowedAudience:
    Type: String
    Default: ""
    Description: >-
      This gateway's own id. Connect puts the gateway id in the JWT "aud" claim and the gateway must list it
      under allowed audiences, otherwise every tool call fails. The id only exists after the first create, so
      stacks/40-genai feeds it back on the next apply (deploy.sh does that second pass automatically).
  McpProtocolVersion:
    Type: String
    Default: "2025-03-26"
    Description: MCP protocol version Amazon Connect speaks; the gateway must support it.

Conditions:
  UseJwt: !Equals [!Ref AuthorizerType, CUSTOM_JWT]
  HasAudience: !Not [!Equals [!Ref AllowedAudience, ""]]

Resources:
  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      Path: !Ref RolePath
      PermissionsBoundary: !Ref PermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock-agentcore.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-tools
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeToolsLambda
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Ref ToolsLambdaArn

  # Authorizer type cannot change in place: new logical id = new JWT gateway, old IAM one is deleted.
  McpGateway:
    Type: AWS::BedrockAgentCore::Gateway
    Properties:
      Name: !Sub "${Prefix}-mcp"
      Description: Serve7 CRM tools for the Q in Connect orchestration agent
      ProtocolType: MCP
      ProtocolConfiguration:
        Mcp:
          SupportedVersions: [!Ref McpProtocolVersion]
      AuthorizerType: !Ref AuthorizerType
      AuthorizerConfiguration: !If
        - UseJwt
        - CustomJWTAuthorizer: !If
            - HasAudience
            # Documented Connect setup: the instance discovery URL + this gateway's id as allowed audience.
            - DiscoveryUrl: !Ref JwtDiscoveryUrl
              AllowedAudience: [!Ref AllowedAudience]
            # First create only (id not known yet): AgentCore needs at least one rule, so pin the issuer.
            - DiscoveryUrl: !Ref JwtDiscoveryUrl
              CustomClaims:
                - InboundTokenClaimName: iss
                  InboundTokenClaimValueType: STRING
                  AuthorizingClaimMatchValue:
                    ClaimMatchOperator: EQUALS
                    ClaimMatchValue:
                      MatchValueString: !Select [0, !Split ["/.well-known", !Ref JwtDiscoveryUrl]]
        - !Ref AWS::NoValue
      RoleArn: !GetAtt GatewayRole.Arn

  McpCrmTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Properties:
      GatewayIdentifier: !GetAtt McpGateway.GatewayIdentifier
      Name: crm
      Description: Serve7 CRM tools (sandbox demo data)
      CredentialProviderConfigurations:
        - CredentialProviderType: GATEWAY_IAM_ROLE
      TargetConfiguration:
        Mcp:
          Lambda:
            LambdaArn: !Ref ToolsLambdaArn
            ToolSchema:
              InlinePayload:
                - Name: customer_lookup
                  Description: >-
                    Find the calling customer by phone number, email address or customer id. Returns customer_id,
                    first name and tier. Call this before any other tool.
                  InputSchema:
                    Type: object
                    Properties:
                      phone: { Type: string, Description: Phone number in any format }
                      email: { Type: string, Description: Email address }
                      customer_id: { Type: string, Description: Customer id such as C1001 }
                - Name: retrieve_status
                  Description: >-
                    Status of the customer's orders (item, status, ETA) and open support tickets.
                    Optionally narrow to one order_id.
                  InputSchema:
                    Type: object
                    Properties:
                      customer_id: { Type: string, Description: Customer id from customer_lookup }
                      order_id: { Type: string, Description: Optional order number }
                    Required: [customer_id]
                - Name: create_support_ticket
                  Description: >-
                    Open a support ticket for the customer. Only call after the customer has confirmed the
                    category and summary. Returns the new ticket id.
                  InputSchema:
                    Type: object
                    Properties:
                      customer_id: { Type: string, Description: Customer id from customer_lookup }
                      category:
                        Type: string
                        Description: "One of: billing, technical, order, account, other"
                      summary: { Type: string, Description: One or two sentences describing the issue }
                    Required: [customer_id, category, summary]

Outputs:
  GatewayArn:
    Value: !GetAtt McpGateway.GatewayArn
  GatewayId:
    Value: !GetAtt McpGateway.GatewayIdentifier
  GatewayUrl:
    Value: !GetAtt McpGateway.GatewayUrl
  TargetId:
    Value: !GetAtt McpCrmTarget.TargetId
