AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Serve7 demo - Renault car rental chat agent (Belgrade, EUR). Synthetic data only. Fleet and reservations tables
  and the HTTPS API that the ACXD chat agent's data requests call. Deployed by demos/_kit/deploy.sh.

Parameters:
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  ApiKeySecretArn:
    Type: String
    Description: Secrets Manager secret (plain string) used as x-api-key. Shared by all kit demos.
  ConnectInstanceId:
    Type: String
    Default: ""
    Description: Connect instance id for the web chat flow (demo.json web.connect_instance_id). Empty = no chat flow.
  AcxdWorkspaceId:
    Type: String
    Default: ""
  AcxdApplicationId:
    Type: String
    Default: ""
  AcxdAlias:
    Type: String
    Default: ""
    NoEcho: true
    Description: Production deployment key of the ACXD app (Secrets Manager demo-kit/web/<demo>/acxd). Empty = no chat flow.

Conditions:
  HasChat: !And
    - !Not [!Equals [!Ref ConnectInstanceId, ""]]
    - !Not [!Equals [!Ref AcxdWorkspaceId, ""]]
    - !Not [!Equals [!Ref AcxdApplicationId, ""]]
    - !Not [!Equals [!Ref AcxdAlias, ""]]

Resources:
  FleetTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: unit_id, AttributeType: S}]
      KeySchema: [{AttributeName: unit_id, KeyType: HASH}]
      SSESpecification: {SSEEnabled: true}
  ReservationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: confirmation, AttributeType: S}]
      KeySchema: [{AttributeName: confirmation, KeyType: HASH}]
      SSESpecification: {SSEEnabled: true}

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: data
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Scan, dynamodb:Query]
                Resource: [!GetAtt FleetTable.Arn, !GetAtt ReservationsTable.Arn]

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Handler: handler.handler
      Timeout: 8
      MemorySize: 256
      Role: !GetAtt ApiRole.Arn
      Code: {S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey}
      Environment:
        Variables:
          FLEET_TABLE: !Ref FleetTable
          RESERVATIONS_TABLE: !Ref ReservationsTable
          TZ: Europe/Belgrade
          API_KEY: !Sub "{{resolve:secretsmanager:${ApiKeySecretArn}}}"
  ApiFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ApiFunction.Arn
      AuthType: NONE   # protected by the x-api-key check; ACXD calls it over HTTPS
  ApiUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE
  ApiInvokeViaUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # ---------- Web chat: Connect chat flow that hands the contact to the ACXD app (used by the CloudFront test page) ----------
  ChatFlow:
    Type: AWS::Connect::ContactFlow
    Condition: HasChat
    Properties:
      InstanceArn: !Sub "arn:${AWS::Partition}:connect:${AWS::Region}:${AWS::AccountId}:instance/${ConnectInstanceId}"
      Name: !Sub "${AWS::StackName}-chat"
      Type: CONTACT_FLOW
      Description: Web chat for the demo test page. Hands the chat to the ACXD application and ends it when the application finishes.
      Content: !Sub |
        {
          "Version": "2019-10-30",
          "StartAction": "log",
          "Actions": [
            {"Identifier": "log", "Type": "UpdateFlowLoggingBehavior",
             "Parameters": {"FlowLoggingBehavior": "Enabled"}, "Transitions": {"NextAction": "greet"}},
            {"Identifier": "greet", "Type": "MessageParticipant",
             "Parameters": {"Text": "Zdravo! Ja sam asistent za iznajmljivanje automobila Renault u Beogradu. Hi! I'm the Renault car rental assistant in Belgrade. Kako mogu da pomognem? / How can I help?"},
             "Transitions": {"NextAction": "agent", "Errors": [{"NextAction": "agent", "ErrorType": "NoMatchingError"}]}},
            {"Identifier": "agent", "Type": "ConnectParticipantWithAgenticCX",
             "Parameters": {"AgentConfiguration": {"WorkspaceId": "${AcxdWorkspaceId}", "ApplicationId": "${AcxdApplicationId}",
               "Alias": "${AcxdAlias}", "ContextVariables": {"contact_id": "$.InitialContactId", "channel": "CHAT"}},
               "SpeechRecognitionConfiguration": {"SpeechRecognitionEngine": "AMAZON_AGENTIC_VOICE"},
               "AudioFillerConfiguration": {"Enabled": false}},
             "Transitions": {"NextAction": "bye-msg",
               "Errors": [{"NextAction": "error-msg", "ErrorType": "NoMatchingError"},
                          {"NextAction": "bye-msg", "ErrorType": "NoMatchingCondition"},
                          {"NextAction": "idle-msg", "ErrorType": "InputTimeLimitExceeded"}],
               "Conditions": [{"NextAction": "team-msg", "Condition": {"Operator": "Equals", "Operands": ["Escalation"]}}]}},
            {"Identifier": "error-msg", "Type": "MessageParticipant",
             "Parameters": {"Text": "Sorry, something went wrong on our side. Please try again in a moment."},
             "Transitions": {"NextAction": "bye", "Errors": [{"NextAction": "bye", "ErrorType": "NoMatchingError"}]}},
            {"Identifier": "idle-msg", "Type": "MessageParticipant",
             "Parameters": {"Text": "I haven't heard from you, so I'll close this chat for now. Start a new chat any time."},
             "Transitions": {"NextAction": "bye", "Errors": [{"NextAction": "bye", "ErrorType": "NoMatchingError"}]}},
            {"Identifier": "team-msg", "Type": "MessageParticipant",
             "Parameters": {"Text": "A team member is not available in this demo. Thanks for chatting."},
             "Transitions": {"NextAction": "bye", "Errors": [{"NextAction": "bye", "ErrorType": "NoMatchingError"}]}},
            {"Identifier": "bye-msg", "Type": "MessageParticipant",
             "Parameters": {"Text": "Thanks for chatting. Goodbye."},
             "Transitions": {"NextAction": "bye", "Errors": [{"NextAction": "bye", "ErrorType": "NoMatchingError"}]}},
            {"Identifier": "bye", "Type": "DisconnectParticipant", "Parameters": {}, "Transitions": {}}
          ]
        }

  # ---------- Web voice: the same ACXD app over an in-browser WebRTC call (Touchpoint Voice mini, "Talk" on the page) ----------
  VoiceFlow:
    Type: AWS::Connect::ContactFlow
    Condition: HasChat
    Properties:
      InstanceArn: !Sub "arn:${AWS::Partition}:connect:${AWS::Region}:${AWS::AccountId}:instance/${ConnectInstanceId}"
      Name: !Sub "${AWS::StackName}-voice"
      Type: CONTACT_FLOW
      Description: Web voice for the demo test page. Hands the call to the ACXD application and ends it when the application finishes.
      Content: !Sub |
        {
          "Version": "2019-10-30",
          "StartAction": "log",
          "Actions": [
            {"Identifier": "log", "Type": "UpdateFlowLoggingBehavior",
             "Parameters": {"FlowLoggingBehavior": "Enabled"}, "Transitions": {"NextAction": "voice"}},
            {"Identifier": "voice", "Type": "UpdateContactTextToSpeechVoice",
             "Parameters": {"TextToSpeechVoice": "Joanna"},
             "Transitions": {"NextAction": "greet", "Errors": [{"NextAction": "greet", "ErrorType": "NoMatchingError"}]}},
            {"Identifier": "greet", "Type": "MessageParticipant",
             "Parameters": {"Text": "Hi! I'm the Renault car rental assistant in Belgrade. How can I help?"},
             "Transitions": {"NextAction": "agent", "Errors": [{"NextAction": "agent", "ErrorType": "NoMatchingError"}]}},
            {"Identifier": "agent", "Type": "ConnectParticipantWithAgenticCX",
             "Parameters": {"AgentConfiguration": {"WorkspaceId": "${AcxdWorkspaceId}", "ApplicationId": "${AcxdApplicationId}",
               "Alias": "${AcxdAlias}", "ContextVariables": {"contact_id": "$.InitialContactId", "channel": "VOICE"}},
               "SpeechRecognitionConfiguration": {"SpeechRecognitionEngine": "AMAZON_AGENTIC_VOICE"},
               "AudioFillerConfiguration": {"Enabled": false}},
             "Transitions": {"NextAction": "bye-msg",
               "Errors": [{"NextAction": "error-msg", "ErrorType": "NoMatchingError"},
                          {"NextAction": "bye-msg", "ErrorType": "NoMatchingCondition"},
                          {"NextAction": "idle-msg", "ErrorType": "InputTimeLimitExceeded"}],
               "Conditions": [{"NextAction": "team-msg", "Condition": {"Operator": "Equals", "Operands": ["Escalation"]}}]}},
            {"Identifier": "error-msg", "Type": "MessageParticipant",
             "Parameters": {"Text": "Sorry, something went wrong on our side. Please try again in a moment. Goodbye."},
             "Transitions": {"NextAction": "bye", "Errors": [{"NextAction": "bye", "ErrorType": "NoMatchingError"}]}},
            {"Identifier": "idle-msg", "Type": "MessageParticipant",
             "Parameters": {"Text": "I didn't hear anything, so I'll end the call for now. You can start again any time. Goodbye."},
             "Transitions": {"NextAction": "bye", "Errors": [{"NextAction": "bye", "ErrorType": "NoMatchingError"}]}},
            {"Identifier": "team-msg", "Type": "MessageParticipant",
             "Parameters": {"Text": "A team member is not available in this demo. Thanks for calling. Goodbye."},
             "Transitions": {"NextAction": "bye", "Errors": [{"NextAction": "bye", "ErrorType": "NoMatchingError"}]}},
            {"Identifier": "bye-msg", "Type": "MessageParticipant",
             "Parameters": {"Text": "Thanks for calling. Goodbye."},
             "Transitions": {"NextAction": "bye", "Errors": [{"NextAction": "bye", "ErrorType": "NoMatchingError"}]}},
            {"Identifier": "bye", "Type": "DisconnectParticipant", "Parameters": {}, "Transitions": {}}
          ]
        }

Outputs:
  AcxdApiUrl:
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  FleetTable:
    Value: !Ref FleetTable
  ReservationsTable:
    Value: !Ref ReservationsTable
  ApiFunctionName:
    Value: !Ref ApiFunction
  ChatFlowId:
    Condition: HasChat
    Value: !Select [3, !Split ["/", !GetAtt ChatFlow.ContactFlowArn]]
  VoiceFlowId:
    Condition: HasChat
    Value: !Select [3, !Split ["/", !GetAtt VoiceFlow.ContactFlowArn]]
