name: deploy
# Deploys tenants with the serve7-deploy role (OIDC), then runs the smoke tests.
# - Merge to main: the tenants in the repository variable CI_TENANTS (default: DEFAULT_TENANT, else sandbox), never prod.
# - Manual run: any tenant/env (prod needs the <tenant>-prod GitHub environment with required reviewers).
# Repository variables: CI_TENANTS, DEFAULT_TENANT, DEFAULT_ENV, USE_ENVIRONMENTS (false = no GitHub environments,
# bootstrap with DEPLOY_TRUST=main-branch), AWS_CI (false = skip until the account is bootstrapped). See docs/setup-new-org.md.
# Source copy: ci/workflows/deploy.yml (install with scripts/install-workflows.sh).
on:
  push:
    branches: [main]
    paths: ["stacks/**", "modules/**", "flows/**", "lambdas/**", "tenants/**", "scripts/**", "bootstrap/**"]
  workflow_dispatch:
    inputs:
      tenant:
        description: Tenant folder under tenants/ (empty = DEFAULT_TENANT variable)
        default: ""
        required: false
      env:
        description: Environment
        type: choice
        options: [dev, test, prod]
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  tenants:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || vars.AWS_CI != 'false'
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      count: ${{ steps.m.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml
      - name: Tenants to deploy
        id: m
        env:
          CI_TENANTS: ${{ vars.CI_TENANTS }}
          DEFAULT_TENANT: ${{ vars.DEFAULT_TENANT }}
          DEFAULT_ENV: ${{ vars.DEFAULT_ENV }}
          IN_TENANT: ${{ inputs.tenant }}
          IN_ENV: ${{ inputs.env }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/ci-tenants.py --tenant "${IN_TENANT:-${DEFAULT_TENANT:-sandbox}}" --env "$IN_ENV" --github >> "$GITHUB_OUTPUT"
          else
            python scripts/ci-tenants.py --no-prod --github >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: tenants
    if: needs.tenants.outputs.count != '0'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.tenants.outputs.matrix) }}
    concurrency:
      group: deploy-${{ matrix.tenant }}-${{ matrix.env }}
      cancel-in-progress: false   # never interrupt an apply
    environment: ${{ vars.USE_ENVIRONMENTS != 'false' && format('{0}-{1}', matrix.tenant, matrix.env) || '' }}
    env:
      TENANT: ${{ matrix.tenant }}
      ENVIRONMENT: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -q boto3 pytest pyyaml

      - name: Unit tests gate
        run: python -m pytest -q lambdas/genai_gateway/tests lambdas/agent_tools/tests

      - name: Resolve tenant
        id: t
        run: |
          python scripts/tenant-info.py $TENANT $ENVIRONMENT --github >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ steps.t.outputs.account }}:role/serve7-deploy
          aws-region: ${{ steps.t.outputs.region }}
          role-session-name: gh-deploy-${{ github.run_id }}
          role-duration-seconds: 7200

      - name: Deploy all layers
        run: AUTO_APPROVE=1 RELEASE=${GITHUB_REF_NAME} ./scripts/deploy.sh "$TENANT" "$ENVIRONMENT"   # main or a release tag; stable so tags do not churn

      - name: Smoke tests
        # phone: quota-dependent; chat: API chats never subscribe a websocket (covered by the qic check)
        run: SMOKE_SKIP=phone,chat python tests/smoke.py --tenant "$TENANT" --env "$ENVIRONMENT"
